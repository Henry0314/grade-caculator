<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>學期及格段考分數試算器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
    body {
      font-family: 'Noto Sans TC', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between p-4 sm:p-6 md:p-8">

  <main class="max-w-xl mx-auto w-full flex-grow flex flex-col justify-center">
    <!-- 主卡片 -->
    <div class="bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
      <!-- 頂部標題區 -->
      <div class="bg-gradient-to-r from-indigo-600 to-blue-600 p-6 text-white text-center">
        <h1 class="text-2xl font-bold tracking-wide flex items-center justify-center gap-2">
          <i class="fa-solid fa-calculator"></i>
          學期及格段考分數試算器
        </h1>
        <p class="text-indigo-100 text-sm mt-1">平時 40% ＋ 3次段考共 60%</p>
      </div>

      <div class="p-6 space-y-6">
        <!-- 成績輸入區塊 -->
        <div class="space-y-4">
          <div>
            <label for="regularScore" class="block text-sm font-semibold text-slate-700 mb-1">
              平時成績 (佔 40%)
            </label>
            <div class="relative rounded-lg shadow-sm">
              <input 
                type="number" 
                id="regularScore" 
                min="0" 
                max="100" 
                step="0.5" 
                placeholder="請輸入 0 ~ 100" 
                class="w-full pl-4 pr-12 py-3 border-2 border-slate-200 rounded-xl focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 text-lg font-medium transition duration-150 outline-none"
              >
              <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-slate-400 font-semibold">
                分
              </div>
            </div>
            
            <!-- 快速填寫標籤 -->
            <div class="flex items-center gap-2 mt-2">
              <span class="text-xs text-slate-400 font-medium">常用分數：</span>
              <div class="flex flex-wrap gap-1.5">
                <button type="button" onclick="setScore(50)" class="text-xs px-2.5 py-1 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 rounded-md text-slate-600 transition">50</button>
                <button type="button" onclick="setScore(60)" class="text-xs px-2.5 py-1 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 rounded-md text-slate-600 transition">60</button>
                <button type="button" onclick="setScore(70)" class="text-xs px-2.5 py-1 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 rounded-md text-slate-600 transition">70</button>
                <button type="button" onclick="setScore(80)" class="text-xs px-2.5 py-1 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 rounded-md text-slate-600 transition">80</button>
                <button type="button" onclick="setScore(90)" class="text-xs px-2.5 py-1 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 rounded-md text-slate-600 transition">90</button>
              </div>
            </div>
          </div>

          <!-- 自訂及格門檻折疊 -->
          <div class="pt-1">
            <details class="text-xs text-slate-500 group">
              <summary class="cursor-pointer hover:text-indigo-600 transition list-none flex items-center gap-1 font-medium">
                <i class="fa-solid fa-sliders text-slate-400"></i>
                進階設定：目標及格分數 (預設 60 分)
              </summary>
              <div class="mt-2.5 p-3 bg-slate-50 rounded-xl border border-slate-200/60 flex items-center justify-between gap-4">
                <span class="text-slate-600">學期目標分：</span>
                <input 
                  type="number" 
                  id="targetScore" 
                  value="60" 
                  min="0" 
                  max="100" 
                  class="w-20 px-2 py-1 border border-slate-300 rounded text-center text-sm font-semibold outline-none focus:border-indigo-500"
                >
              </div>
            </details>
          </div>
        </div>

        <!-- 計算結果展示卡片 -->
        <div id="resultCard" class="bg-slate-50 rounded-2xl p-5 border border-slate-200 transition-all duration-300">
          <div class="flex items-center justify-between border-b border-slate-200/80 pb-3 mb-4">
            <span class="text-sm font-bold text-slate-700 flex items-center gap-1.5">
              <i class="fa-solid fa-chart-line text-indigo-500"></i>
              試算結果
            </span>
            <button 
              id="copyBtn" 
              onclick="copyResult()" 
              class="text-xs font-semibold px-2.5 py-1 bg-white border border-slate-200 hover:border-indigo-400 hover:text-indigo-600 rounded-lg shadow-sm transition flex items-center gap-1"
            >
              <i class="fa-regular fa-copy"></i>
              <span id="copyBtnText">複製結果</span>
            </button>
          </div>

          <!-- 核心主要數值 -->
          <div class="text-center py-2">
            <p class="text-xs sm:text-sm text-slate-500 font-medium">3次段考「平均最低需達到」</p>
            <div class="flex items-baseline justify-center gap-1 my-2">
              <span id="targetExamAvg" class="text-5xl font-black text-slate-900 tracking-tight">--</span>
              <span class="text-lg font-bold text-slate-500">分</span>
            </div>
            <p id="subTip" class="text-xs text-slate-400">已套用無條件進位取整數</p>
          </div>

          <!-- 詳細拆解資訊 -->
          <div class="grid grid-cols-2 gap-3 mt-4 pt-4 border-t border-slate-200/80 text-center">
            <div class="bg-white p-3 rounded-xl border border-slate-100 shadow-sm">
              <span class="block text-xs text-slate-400 font-medium mb-1">3次段考總分需</span>
              <span id="totalExamNeeded" class="text-base font-bold text-slate-700">--</span>
            </div>
            <div class="bg-white p-3 rounded-xl border border-slate-100 shadow-sm">
              <span class="block text-xs text-slate-400 font-medium mb-1">精確計算值 (未進位)</span>
              <span id="exactVal" class="text-base font-bold text-slate-700">--</span>
            </div>
          </div>

          <!-- 提示反饋訊息 -->
          <div id="statusMessage" class="mt-4 p-3.5 rounded-xl text-xs sm:text-sm text-center font-medium bg-slate-100 text-slate-600">
            請輸入平時成績開始計算
          </div>
        </div>

        <!-- 說明公式折疊 -->
        <div class="border-t border-slate-100 pt-3">
          <p class="text-xs text-slate-400 leading-relaxed text-center">
            計算公式：<code>(及格門檻 - 平時成績 × 0.4) ÷ 0.6</code> 並取無條件進位整數
          </p>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center text-xs text-slate-400 py-4">
    學期及格段考分數試算器 &bull; 單頁即時試算
  </footer>

  <script>
    const regularScoreInput = document.getElementById('regularScore');
    const targetScoreInput = document.getElementById('targetScore');
    const targetExamAvgEl = document.getElementById('targetExamAvg');
    const totalExamNeededEl = document.getElementById('totalExamNeeded');
    const exactValEl = document.getElementById('exactVal');
    const statusMessageEl = document.getElementById('statusMessage');
    const resultCardEl = document.getElementById('resultCard');

    function calculate() {
      const regStr = regularScoreInput.value.trim();
      const targetStr = targetScoreInput.value.trim();

      if (regStr === '') {
        resetDisplay('請輸入平時成績開始計算');
        return;
      }

      const regular = parseFloat(regStr);
      const target = parseFloat(targetStr) || 60;

      if (isNaN(regular) || regular < 0) {
        resetDisplay('請輸入有效的分數數值');
        return;
      }

      // 平時貢獻的分數 (佔 40%)
      const regularContribution = regular * 0.40;
      // 段考需要補足的分數 (佔 60%)
      const examNeededTotalFraction = target - regularContribution;

      // 段考平均最低需求
      const requiredExamAvgExact = examNeededTotalFraction / 0.60;
      // 依要求無條件進位取整
      const requiredExamAvgCeil = Math.ceil(requiredExamAvgExact);

      // 更新數值顯示
      exactValEl.textContent = (requiredExamAvgExact > 0 ? requiredExamAvgExact.toFixed(2) : '0') + ' 分';

      // 情境判斷處理
      if (regularContribution >= target) {
        // 平時成績直接穩過
        targetExamAvgEl.textContent = '0';
        totalExamNeededEl.textContent = '0 分 (已達標)';
        exactValEl.textContent = '0 分';
        
        setStyle('safe');
        statusMessageEl.innerHTML = `🎉 恭喜！你的平時成績貢獻了 <b>${regularContribution.toFixed(1)}</b> 分，已直接越過及格門檻（${target}分），段考 0 分也能及格！`;
      } else if (requiredExamAvgExact > 100) {
        // 段考就算滿分也無法及格
        targetExamAvgEl.textContent = requiredExamAvgCeil;
        totalExamNeededEl.textContent = (requiredExamAvgCeil * 3) + ' 分';

        setStyle('danger');
        statusMessageEl.innerHTML = `⚠️ 注意：3次段考平均需要 <b>${requiredExamAvgCeil}</b> 分（超過 100 分），即便段考全拿滿分學期最高也僅能拿到 <b>${(regularContribution + 60).toFixed(1)}</b> 分。`;
      } else {
        // 一般需努力區間 (0 ~ 100)
        const finalAvg = Math.max(0, requiredExamAvgCeil);
        targetExamAvgEl.textContent = finalAvg;
        totalExamNeededEl.textContent = (finalAvg * 3) + ' 分';

        setStyle('normal');
        statusMessageEl.innerHTML = `🎯 3次段考平均至少需 <b>${finalAvg}</b> 分（3次總分達 <b>${finalAvg * 3}</b> 分），學期總評即可順利通過 ${target} 分門檻！`;
      }
    }

    function setScore(score) {
      regularScoreInput.value = score;
      calculate();
    }

    function setStyle(type) {
      // 清理舊 class
      resultCardEl.className = 'rounded-2xl p-5 border transition-all duration-300';
      statusMessageEl.className = 'mt-4 p-3.5 rounded-xl text-xs sm:text-sm text-center font-medium leading-relaxed';

      if (type === 'safe') {
        resultCardEl.classList.add('bg-emerald-50/60', 'border-emerald-200');
        targetExamAvgEl.className = 'text-5xl font-black text-emerald-600 tracking-tight';
        statusMessageEl.classList.add('bg-emerald-100/70', 'text-emerald-800');
      } else if (type === 'danger') {
        resultCardEl.classList.add('bg-rose-50/60', 'border-rose-200');
        targetExamAvgEl.className = 'text-5xl font-black text-rose-600 tracking-tight';
        statusMessageEl.classList.add('bg-rose-100/70', 'text-rose-800');
      } else {
        resultCardEl.classList.add('bg-indigo-50/40', 'border-indigo-100');
        targetExamAvgEl.className = 'text-5xl font-black text-indigo-600 tracking-tight';
        statusMessageEl.classList.add('bg-indigo-100/60', 'text-indigo-800');
      }
    }

    function resetDisplay(msg) {
      targetExamAvgEl.textContent = '--';
      targetExamAvgEl.className = 'text-5xl font-black text-slate-800 tracking-tight';
      totalExamNeededEl.textContent = '--';
      exactValEl.textContent = '--';
      resultCardEl.className = 'bg-slate-50 rounded-2xl p-5 border border-slate-200 transition-all duration-300';
      statusMessageEl.className = 'mt-4 p-3.5 rounded-xl text-xs sm:text-sm text-center font-medium bg-slate-100 text-slate-600';
      statusMessageEl.textContent = msg;
    }

    function copyResult() {
      const avg = targetExamAvgEl.textContent;
      if (avg === '--') {
        alert('請先輸入平時成績！');
        return;
      }
      const regular = regularScoreInput.value;
      const target = targetScoreInput.value || 60;
      const total = totalExamNeededEl.textContent;
      
      const copyText = `【學期及格試算】\n平時成績(40%)：${regular} 分\n目標學期分：${target} 分\n👉 3次段考平均最低需：${avg} 分\n👉 3次段考總分需：${total}`;

      navigator.clipboard.writeText(copyText).then(() => {
        const copyBtnText = document.getElementById('copyBtnText');
        copyBtnText.textContent = '已複製！';
        setTimeout(() => {
          copyBtnText.textContent = '複製結果';
        }, 2000);
      });
    }

    regularScoreInput.addEventListener('input', calculate);
    targetScoreInput.addEventListener('input', calculate);
  </script>
</body>
</html>
